name: CI/CD

# Runs automatically on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  lint:
    name: Code style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - name: Run flake8
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__
      - name: Check the Firebase JSON files are valid
        run: |
          python -m json.tool firebase.json > /dev/null
          python -m json.tool database.rules.json > /dev/null

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install MQTT broker (Mosquitto)
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto || true
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit + integration tests
        run: pytest -v

  deploy:
    name: Deploy dashboard to Firebase Hosting
    runs-on: ubuntu-latest
    needs: test
    # Only deploy when code is pushed to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Write the dashboard config (database URL)
        env:
          DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "FIREBASE_DB_URL secret is not set"
            exit 1
          fi
          printf 'window.FIREBASE_DB_URL = "%s";\n' "$DB_URL" > public/firebase-config.js

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Check that the live dashboard answers
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent --max-time 20 "https://$PROJECT_ID.web.app/" | grep -q "UAV cloud dashboard"; then
              echo "Dashboard is live: https://$PROJECT_ID.web.app/"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 10 s..."
            sleep 10
          done
          echo "Dashboard did not answer in time"
          exit 1

      - name: Check that the cloud server program answers (optional)
        env:
          CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
        run: |
          if [ -z "$CLOUD_API_URL" ]; then
            echo "CLOUD_API_URL secret is not set - skipping this check"
            exit 0
          fi
          # Vercel deploys on its own after each push, so wait for the new version
          for i in $(seq 1 12); do
            if curl --fail --silent --max-time 20 "$CLOUD_API_URL/api/ingest" | grep -q "uav-ingest"; then
              echo "Cloud server program is live: $CLOUD_API_URL/api/ingest"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 10 s..."
            sleep 10
          done
          echo "Cloud server program did not answer in time"
          exit 1
